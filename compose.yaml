services:
  postgres:
    image: postgres:17
    ports:
      - '127.0.0.1:5434:5432'
    environment:
      POSTGRES_DB: learnbridge
      POSTGRES_USER: learnbridge
      POSTGRES_PASSWORD: learnbridge_local
    volumes:
      - learnbridge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U learnbridge -d learnbridge']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  learnbridge_postgres_data:
